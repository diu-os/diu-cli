[package]
name = "diu-cli"
version = "0.1.0"
edition = "2021"
description = "diu — the DIU OS userland SDK/CLI (ADR D-123 stage 2): scaffold a gene, run the kernel's Gate 1 locally, publish to a platform instance."

[[bin]]
name = "diu"
path = "src/main.rs"

[dependencies]
diu-kernel = { path = "../../kernel" }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "blocking"] }
