[package]
name = "diu-cli"
version = "0.2.0"
edition = "2021"
description = "diu — command-line SDK for DIU OS genes: scaffold a gene passport, run the kernel's Gate 1 locally, compute its content hash, and publish to a DIU OS instance."
license = "Apache-2.0" # ADR D-124 amendment, founder decision 12 Nov 2026
repository = "https://github.com/diu-os/diu-cli"
homepage = "https://diu-os.dev"
readme = "README.md"
keywords = ["reproducibility", "verification", "science", "cli"]
categories = ["command-line-utilities", "science"]
exclude = [".github/"]

[[bin]]
name = "diu"
path = "src/main.rs"

[dependencies]
# `path` for the monorepo build; `version` is what crates.io resolves.
diu-kernel = { path = "../../kernel", version = "0.2.0" }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "blocking"] }
